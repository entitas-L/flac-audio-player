name: Android Cloud Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_type:
        description: "APK build variant"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK (${{ inputs.build_type || 'debug' }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        if: ${{ (inputs.build_type || 'debug') == 'debug' }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        if: ${{ inputs.build_type == 'release' }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Run Android Lint (non-blocking)
        if: ${{ (inputs.build_type || 'debug') == 'debug' }}
        continue-on-error: true
        run: ./gradlew lintDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: flac-audio-player-${{ inputs.build_type || 'debug' }}-apk
          path: app/build/outputs/apk/${{ inputs.build_type || 'debug' }}/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Lint report
        if: ${{ always() && (inputs.build_type || 'debug') == 'debug' }}
        uses: actions/upload-artifact@v7
        with:
          name: android-lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14
